<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <title>Spanda By Cura · Centre For Rehabilitation & Recovery</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SPANDA by Cura is a rehabilitation centre in Whitefield, Bengaluru, offering personalised orthopaedic, neurological and pulmonary rehabilitation shaped around an individual assessment."
    />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" type="image/png" href="favicon.png" />

  <body>
    <app-root></app-root>
    <!-- Static copy of the callback form so Netlify Forms can detect it at deploy time. -->
  <form name="callback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="callback" />
    <input name="bot-field" /><input name="name" /><input name="phone" /><input name="speciality" /><input name="time" /><input name="consent" /><input name="page" />
  </form>
</body>
