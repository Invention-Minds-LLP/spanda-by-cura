# Netlify build settings for the Angular app.
[build]
  command = "npm run build"
  publish = "dist/spanda/browser"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let Angular's router handle every path (e.g. /opening).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files never change, so cache them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
