# Netlify build settings for the Angular app (prerendered static pages).
[build]
  command = "npm run build && node scripts/postbuild.mjs"
  publish = "dist/spanda/browser"

[build.environment]
  NODE_VERSION = "22"
  # Set SITE_INDEXABLE = "true" in Netlify's environment variables only after launch approval.

# Unknown URLs: serve the client-side app, which shows the "page not found" view, with a real 404 status.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 404

# Hashed build files never change, so cache them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
